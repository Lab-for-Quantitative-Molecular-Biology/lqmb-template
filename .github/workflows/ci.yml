name: LQMB template checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    name: Validate LQMB structure and metadata
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check required framework files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            README.md
            CLAUDE.md
            AI_PROVENANCE.md
            CONTRIBUTING.md
            LICENSE
            CHANGELOG.md
            TEMPLATE_VERSION
            .gitignore
            .lqmb/project.json
            .lqmb/dependencies.json
            .lqmb/manifest.json
            .lqmb/README.md
            .lqmb/bin/template-status.py
            .lqmb/tests/test_validate_metadata.py
            docs/lqmb/LQMB_LIVING_PROJECT_FRAMEWORK.md
            docs/lqmb/TEMPLATE_UPDATE_PROTOCOL.md
            docs/lqmb/DEPENDENCY_UPDATE_PROTOCOL.md
            docs/lqmb/V0.2_MIGRATION_FROM_V0.1.md
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "ERROR: missing required file: $file"; exit 1; }
          done

          required_dirs=(
            src
            tests
            scripts
            workflows
            configs
            notebooks
            manuscript
            .github/ISSUE_TEMPLATE
            .lqmb/bin
          )

          for dir in "${required_dirs[@]}"; do
            test -d "$dir" || { echo "ERROR: missing required directory: $dir"; exit 1; }
          done

      - name: Validate JSON metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool .lqmb/project.json >/dev/null
          python3 -m json.tool .lqmb/dependencies.json >/dev/null
          python3 -m json.tool .lqmb/manifest.json >/dev/null

      - name: Validate template self metadata
        shell: bash
        run: |
          set -euo pipefail

          test "$(tr -d '\r\n' < TEMPLATE_VERSION)" = "0.2.3"

          python3 .lqmb/bin/validate_metadata.py

      - name: Run LQMB metadata validation regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .lqmb/tests/test_validate_metadata.py -v

      - name: Check for tracked macOS metadata and archive artefacts
        shell: bash
        run: |
          set -euo pipefail

          bad=$(git ls-files | grep -E '(^|/)(\.DS_Store|__MACOSX)(/|$)' || true)

          if [ -n "$bad" ]; then
            echo "ERROR: tracked macOS/archive artefacts detected:"
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Check data directories contain no tracked research files
        shell: bash
        run: |
          set -euo pipefail

          tracked_data=$(git ls-files 'data/*' ':!data/README.md' ':!data/.gitkeep' || true)

          if [ -n "$tracked_data" ]; then
            echo "ERROR: tracked files found under data/ beyond documentation placeholders."
            printf '%s\n' "$tracked_data"
            exit 1
          fi

      - name: Check for common credential patterns
        shell: bash
        run: |
          set -euo pipefail

          if git grep -n -I -E 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|ghp_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{20,}' -- . ':!AI_PROVENANCE.md'; then
            echo "ERROR: possible credential or private-key pattern detected."
            exit 1
          fi

      - name: Validate template inspection tool
        shell: bash
        run: |
          set -euo pipefail
          python3 .lqmb/bin/template-status.py --json >/tmp/lqmb-template-status.json
          python3 -m json.tool /tmp/lqmb-template-status.json >/dev/null

      - name: Check whitespace
        run: git diff --check
