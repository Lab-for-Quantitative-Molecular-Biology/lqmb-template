name: LQMB template checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    name: Validate LQMB structure and metadata
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history is required so the AI-provenance check below can
          # walk the commit range being introduced by this push or PR.
          fetch-depth: 0

      - name: Check required framework files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            README.md
            CLAUDE.md
            AI_PROVENANCE.md
            CONTRIBUTING.md
            LICENSE
            CHANGELOG.md
            TEMPLATE_VERSION
            .gitignore
            .lqmb/project.json
            .lqmb/dependencies.json
            .lqmb/manifest.json
            .lqmb/README.md
            .lqmb/bin/template-status.py
            .lqmb/tests/test_validate_metadata.py
            .lqmb/tests/test_check_ai_provenance.py
            .lqmb/tests/test_check_manifest_hygiene.py
            docs/lqmb/LQMB_LIVING_PROJECT_FRAMEWORK.md
            docs/lqmb/TEMPLATE_UPDATE_PROTOCOL.md
            docs/lqmb/DEPENDENCY_UPDATE_PROTOCOL.md
            docs/lqmb/V0.2_MIGRATION_FROM_V0.1.md
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "ERROR: missing required file: $file"; exit 1; }
          done

          required_dirs=(
            src
            tests
            scripts
            workflows
            configs
            notebooks
            manuscript
            .github/ISSUE_TEMPLATE
            .lqmb/bin
          )

          for dir in "${required_dirs[@]}"; do
            test -d "$dir" || { echo "ERROR: missing required directory: $dir"; exit 1; }
          done

      - name: Validate JSON metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool .lqmb/project.json >/dev/null
          python3 -m json.tool .lqmb/dependencies.json >/dev/null
          python3 -m json.tool .lqmb/manifest.json >/dev/null

      - name: Validate template self metadata
        shell: bash
        run: |
          set -euo pipefail

          python3 .lqmb/bin/validate_metadata.py

      - name: Run LQMB metadata validation regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .lqmb/tests/test_validate_metadata.py -v

      - name: Run AI provenance regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .lqmb/tests/test_check_ai_provenance.py -v

      - name: Check AI provenance trailers
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # See AI_PROVENANCE.md. Determine the commit range this push or PR
          # actually introduces; checking the whole history on every run
          # would re-flag commits nobody in this range wrote.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_HEAD_SHA"
          fi

          # A new branch or a force-push reports an all-zero "before" SHA;
          # there is no prior state to diff against, so check only the
          # newly pushed commit itself.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="${head}^"
          fi

          python3 .lqmb/bin/check_ai_provenance.py --base "$base" --head "$head"

      - name: Run manifest hygiene regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .lqmb/tests/test_check_manifest_hygiene.py -v

      - name: Check manifest hygiene
        shell: bash
        run: |
          set -euo pipefail
          python3 .lqmb/bin/check_manifest_hygiene.py

      - name: Check for tracked macOS metadata and archive artefacts
        shell: bash
        run: |
          set -euo pipefail

          bad=$(git ls-files | grep -E '(^|/)(\.DS_Store|__MACOSX)(/|$)' || true)

          if [ -n "$bad" ]; then
            echo "ERROR: tracked macOS/archive artefacts detected:"
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Check data directories contain no tracked research files
        shell: bash
        run: |
          set -euo pipefail

          tracked_data=$(git ls-files 'data/*' ':!data/README.md' ':!data/.gitkeep' || true)

          if [ -n "$tracked_data" ]; then
            echo "ERROR: tracked files found under data/ beyond documentation placeholders."
            printf '%s\n' "$tracked_data"
            exit 1
          fi

      - name: Check example dataset sizes
        shell: bash
        run: |
          set -euo pipefail

          # examples/ is a protected (project-owned) path in .lqmb/manifest.json
          # while this workflow is template-managed, so an oversized fixture is
          # reported as a warning and must never fail a downstream project's CI.
          limit_bytes=1048576
          oversized=""

          while IFS= read -r file; do
            [ -f "$file" ] || continue
            size=$(wc -c <"$file" | tr -d ' ')
            if [ "$size" -gt "$limit_bytes" ]; then
              oversized="${oversized}  ${file} (${size} bytes)"$'\n'
            fi
          done < <(git ls-files examples/)

          if [ -n "$oversized" ]; then
            echo "::warning::Files under examples/ exceed the ${limit_bytes}-byte guideline for small demonstration fixtures."
            printf '%s' "$oversized"
          else
            echo "examples/: no files above the ${limit_bytes}-byte guideline."
          fi

      - name: Check for common credential patterns
        shell: bash
        run: |
          set -euo pipefail

          if git grep -n -I -E 'AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|ghp_[A-Za-z0-9_]{30,}|github_pat_[A-Za-z0-9_]{20,}' -- . ':!AI_PROVENANCE.md'; then
            echo "ERROR: possible credential or private-key pattern detected."
            exit 1
          fi

      - name: Validate template inspection tool
        shell: bash
        run: |
          set -euo pipefail
          python3 .lqmb/bin/template-status.py --json >/tmp/lqmb-template-status.json
          python3 -m json.tool /tmp/lqmb-template-status.json >/dev/null

      - name: Check whitespace
        run: git diff --check
